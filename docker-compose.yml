services:
  db:
    image: postgres
    container_name: lard_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -c 'SELECT 1' -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: >
      bash -c "
        docker-entrypoint.sh postgres &
        PID=\$!
        sleep 5
        until pg_isready -U postgres; do sleep 1; done
        sleep 2
        echo 'Running schema initialization...'
        ls -la /docker-entrypoint-initdb.d/
        for f in /docker-entrypoint-initdb.d/*.sql; do
          if [ -f \"\$f\" ]; then
            echo \"Executing \$f...\"
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f \"\$f\" 2>&1 || echo \"Warning: \$f failed or already executed\"
          fi
        done
        echo 'Schema initialization complete!'
        psql -U postgres -d postgres -c \"SELECT schemaname, tablename FROM pg_tables WHERE schemaname IN ('public', 'labels', 'flags', 'legacy') ORDER BY schemaname, tablename;\" || true
        wait \$PID
      "

  egress:
    build:
      context: .
      dockerfile: egress/Dockerfile
    container_name: lard_egress
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - LARD_CONN_STRING=postgresql://postgres:postgres@db:5432/postgres
      - LARD_RESTRICTED_CONN_STRING=postgresql://postgres:postgres@db:5432/postgres
      - LARD_READONLY_CONN_STRING=postgresql://postgres:postgres@db:5432/postgres
      - LARD_READONLY_RESTRICTED_CONN_STRING=postgresql://postgres:postgres@db:5432/postgres
      - STINFO_CONN_STRING=postgresql://postgres:postgres@db:5432/postgres
      - PARAMCONV_CSV=/resources/paramconversions.csv
      - AWS_REGION=us-east-1
      - S3_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=test
    volumes:
      - ./resources:/resources:ro
    command: ["lard_egress"]

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: lard_ingestion
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      - LARD_CONN_STRING=postgresql://postgres:postgres@db:5432/postgres
      - LARD_RESTRICTED_CONN_STRING=postgresql://postgres:postgres@db:5432/postgres
      - PG_CONN_STRING=postgresql://postgres:postgres@db:5432/postgres
      - STINFO_CONN_STRING=postgresql://postgres:postgres@db:5432/postgres
    volumes:
      - ./qc_pipelines:/qc_pipelines:ro
      - ./resources:/resources:ro
    command: ["lard_ingestion"]

  localstack:
    image: localstack/localstack
    container_name: lard_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - GATEWAY_LISTEN=0.0.0.0:4566
      - DEBUG=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

